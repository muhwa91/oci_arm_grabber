name: tenancy-watch

# 구 테넌시(도쿄)가 삭제돼야 새 계정(싱가포르) 가입이 가능하다.
# PC 가 꺼져 있어도 놓치지 않도록 GitHub 러너가 하루 1회 생존 여부를 확인한다.
# 발신은 **텔레그램 감시 봇 하나**다(2026-08-16 운영자 지시로 디스코드 제거).
# 세 상태를 다 보낸다 — alive 는 매일 🕒 생존 보고, deleted 를 받으면 이 워크플로를 Disable 하고
# 새 계정 가입으로 넘어간다. ⚠️ 종전 이 줄은 "살아있으면 무음"이라고 적었으나 **거짓이었다**
# (alive 도 매일 발신하고 있었다). 서술을 고칠 땐 실제 발신 경로를 재고 적을 것.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = KST 09:00, 하루 1회

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet oci
      - run: python -u check_tenancy.py --selftest # 판정 로직 검증(OCI 호출 없음)
      - name: check tenancy alive
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_PEM: ${{ secrets.OCI_KEY_PEM }}
          # 발신은 **텔레그램 감시 봇 하나**다(2026-08-16 운영자 지시로 디스코드 제거).
          # deleted·alive·보류 세 상태가 전부 이리로 온다 — DISCORD_* 를 다시 넣지 마라.
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
        run: python -u check_tenancy.py
